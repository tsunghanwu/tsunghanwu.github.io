<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#020617">
    <title>Page not found | Tsung-Han Wu</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Roboto Mono';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('/fonts/roboto-mono-latin-700-normal.woff2') format('woff2');
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: 'Inter', sans-serif;
            background: #020617 radial-gradient(ellipse at 85% 5%, rgba(14,165,233,.07), transparent 40%);
            color: #f1f5f9;
            text-align: center;
        }
        .code { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: .8rem; letter-spacing: .16em; color: #7dd3fc; }
        h1 { margin: 1rem 0; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.035em; }
        p { margin: 0 auto 2rem; max-width: 26rem; color: #94a3b8; line-height: 1.7; }
        a {
            display: inline-block;
            padding: 1rem 1.5rem;
            border-radius: .75rem;
            background: #0ea5e9;
            color: #020617;
            font-weight: 700;
            font-size: .875rem;
            text-decoration: none;
        }
        a:hover { background: #38bdf8; }
        a:focus-visible { outline: 2px solid #0ea5e9; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <div class="code">ERROR 404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for doesn't exist or has moved.</p>
        <a href="/">Back to home</a>
    </main>
</body>
</html>
